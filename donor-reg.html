<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Registration - WCC Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="register.css">
</head>
<body>

    <div class="register-container">
        <div class="register-header">
            <a href="index.html" class="logo">
                <img src="wcc.png" alt="WCC Logo" class="logo-img">
            </a>
            <span class="role-badge donor-badge"><i class="fa-solid fa-donate"></i> Donor Account</span>
            <h2>Create Donor Account</h2>
            <p>Join us to make a difference through your support</p>
        </div>

        <form id="donor-form" novalidate>
            <!-- Full Name -->
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-user input-icon"></i>
                    <input type="text" id="fullName" placeholder="Enter your full name" required>
                </div>
            </div>

            <!-- Email Address -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope input-icon"></i>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>
            </div>

            <!-- Phone Number -->
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-phone input-icon"></i>
                    <input type="tel" id="phone" placeholder="017XXXXXXXX" required>
                </div>
            </div>

            <!-- Donor Type -->
            <div class="form-group">
                <label for="donorType">Donor Type</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-building-user input-icon"></i>
                    <select id="donorType" required>
                        <option value="" disabled selected>Select donor type</option>
                        <option value="individual">Individual</option>
                        <option value="organization">Organization / Corporate</option>
                    </select>
                </div>
            </div>

            <!-- Preferred Support Areas -->
            <div class="form-group">
                <label for="supportArea">Preferred Support Category</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-hand-holding-heart input-icon"></i>
                    <select id="supportArea" required>
                        <option value="" disabled selected>Select category</option>
                        <option value="education">Education Support</option>
                        <option value="medical">Medical Assistance</option>
                        <option value="food">Food & Emergency Relief</option>
                        <option value="general">General Donations</option>
                    </select>
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="password" placeholder="Minimum 6 characters" required>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-shield-halved input-icon"></i>
                    <input type="password" id="confirmPassword" placeholder="Repeat password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">
                Register as Donor
            </button>
        </form>

        <div class="register-footer">
            <p>Already have an account? <a href="login.html">Sign In</a></p>
        </div>
    </div>

    <script type="module" src="register.js"></script>
</body>
</html>
