<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer Registration - WCC Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="register.css">
</head>
<body>

    <div class="register-container">
        <div class="register-header">
            <a href="index.html" class="logo">
                <img src="wcc.png" alt="WCC Logo" class="logo-img">
            </a>
            <span class="role-badge volunteer-badge"><i class="fa-solid fa-hand-holding-heart"></i> Volunteer Account</span>
            <h2>Become a Volunteer</h2>
            <p>Join our team to make a direct impact in communities</p>
        </div>

        <form id="volunteer-form" novalidate>
            <!-- Full Name -->
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-user input-icon"></i>
                    <input type="text" id="fullName" placeholder="Enter your full name" required>
                </div>
            </div>

            <!-- Email Address -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope input-icon"></i>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>
            </div>

            <!-- Phone Number -->
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-phone input-icon"></i>
                    <input type="tel" id="phone" placeholder="017XXXXXXXX" required>
                </div>
            </div>

            <!-- NID / Student ID -->
            <div class="form-group">
                <label for="identityNo">NID / Student ID</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-id-card input-icon"></i>
                    <input type="text" id="identityNo" placeholder="Enter NID or Student ID" required>
                </div>
            </div>

            <!-- Primary Skill -->
            <div class="form-group">
                <label for="skills">Area of Expertise / Skill</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-briefcase input-icon"></i>
                    <select id="skills" required>
                        <option value="" disabled selected>Select your main skill</option>
                        <option value="event-mgmt">Event Management</option>
                        <option value="field-work">Field Operations & Relief</option>
                        <option value="teaching">Teaching / Training</option>
                        <option value="design-tech">Graphic Design & Tech</option>
                        <option value="medical">Medical / First Aid</option>
                    </select>
                </div>
            </div>

            <!-- Availability -->
            <div class="form-group">
                <label for="availability">Availability</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-clock input-icon"></i>
                    <select id="availability" required>
                        <option value="" disabled selected>Select availability</option>
                        <option value="weekends">Weekends Only</option>
                        <option value="weekdays">Weekdays</option>
                        <option value="flexible">Flexible / Call Basis</option>
                    </select>
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="password" placeholder="Minimum 6 characters" required>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-shield-halved input-icon"></i>
                    <input type="password" id="confirmPassword" placeholder="Repeat password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">
                Register as Volunteer
            </button>
        </form>

        <div class="register-footer">
            <p>Already have an account? <a href="login.html">Sign In</a></p>
        </div>
    </div>

    <script type="module" src="register.js"></script>
</body>
</html>
